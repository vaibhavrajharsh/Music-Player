<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/68dffed02e.js"
      crossorigin="anonymous"
    ></script>
    <link rel="icon" href="favicon.ico" />
    <title>Melody : Music for everyone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

  </head>



  <body>
    <main>
      <!-- Sidebar -->
      <aside>
        <div class="header">
          <h2>Melody</h2>
          <p id="home-logo" class="active">
            <i class="fa-solid fa-house"></i> Home
          </p>
          <p id="searchbar">
            <i class="fa-solid fa-magnifying-glass"></i> Search
          </p>


   
        </div>

        <div class="playlist">
          <p>
            <svg
              data-encore-id="icon"
              role="img"
              aria-hidden="true"
              viewBox="0 0 24 24"
              class="Svg-sc-ytk21e-0 bneLcE"
            >
              <path
                d="M3 22a1 1 0 0 1-1-1V3a1 1 0 0 1 2 0v18a1 1 0 0 1-1 1zM15.5 2.134A1 1 0 0 0 14 3v18a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V6.464a1 1 0 0 0-.5-.866l-6-3.464zM9 2a1 1 0 0 0-1 1v18a1 1 0 1 0 2 0V3a1 1 0 0 0-1-1z"
              ></path>
            </svg>
            Your Library
          </p>
          <div class="lists">
            <ul></ul>
          </div>
        </div>
      </aside>

      <!-- Main Content (Dynamic) -->
      <div class="main-content" id="main-content">
        <!-- Home content will be dynamically loaded here -->
      </div>
    </main>
    <!-- music player and controls -->
     <div class="music-player">
        <div class="album-portion">
            <div class="album-picture">
                <img src="album_picture.jpeg">
            </div>
            <div class="album-content">
                <p class="album-title">Daylight</p>
                <p class="album-info">David Kushnar</p>
            </div>
            <div class="album-icons">
                <img src="album_icon1.png">
                <img src="album_icon2.png" style="height:1.4rem;width:1.4rem">
            </div>
        </div>
        <div class="player-portion">
            <div class="player-icons">
                <img src="player_icon1.png">
                <img src="player_icon2.png">
                <img src="player_icon3.png" style="height:2rem;width:2rem;opacity:1">
                <img src="player_icon4.png">
                <img src="player_icon5.png">
            </div>
            <div class="progress-bar">
                <span class="curr-time">0:00</span>
                <input type="range" min="0" max="100" step="1">
                <span class="tot-time">3:33</span>

            </div>
        </div>
        <div class="control-bar">
            <div class="control-bar-icons">
            <img src="controls_icon1.png" >
            <img src="controls_icon2.png" style="height:1.3rem;width:1.3rem;opacity: 0.7;">
            <img src="controls_icon3.png" style="height:1rem;width:1rem;opacity: 0.7;">
            <div class="control-playback-bar">
                <img src="controls_icon4.png">
                <input type="range" min="0" max="100" step="1">
            </div>
            </div>           
        </div>
     </div>

    <div id="auth-backdrop" class="hidden"></div>

    <div class="auth-container hidden" id="auth-section">
        <button class="close-btn" id="close-auth">&times;</button>
        <div class="auth-toggle">
            <button id="show-login" class="active">Login</button>
            <button id="show-signup">Sign Up</button>
        </div>

        <form id="login-form" class="auth-form">
            <h2>Login</h2>
            <input type="email" placeholder="Email" required />
            <input type="password" placeholder="Password" required />
            <button type="submit">Log In</button>
        </form>


    <script>
      // Load Home Page by default
      window.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "bright") {
          document.body.classList.add("bright-mode");
        }

        // Load home page dynamically, then bind playlist cards
        loadPage("home.html").then(() => {
          bindPlaylistCards(); // ✅ Reattach playlist click events after content load
        });
      });

      // Dynamic Page Loader
      async function loadPage(page) {
        const res = await fetch(page);
        const content = await res.text();
        document.getElementById("main-content").innerHTML = content;

        // ✅ Reapply theme
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "bright") {
          document.body.classList.add("bright-mode");
        } else {
          document.body.classList.remove("bright-mode");
        }

        // ✅ Rebind card click listeners after DOM updates
        setTimeout(() => {
          if (typeof bindPlaylistCards === "function") {
            bindPlaylistCards();
          }
        }, 50);

        // ✅ Re-attach theme toggle event listener if present
        const themeToggle = document.getElementById("theme-toggle");
        if (themeToggle) {
          updateThemeToggleText(themeToggle);
          themeToggle.addEventListener("click", function () {
            document.body.classList.toggle("bright-mode");
            localStorage.setItem(
              "theme",
              document.body.classList.contains("bright-mode")
                ? "bright"
                : "dark"
            );
            updateThemeToggleText(this);
          });
        }
      }

      // Update toggle text based on current theme
      function updateThemeToggleText(button) {
        if (document.body.classList.contains("bright-mode")) {
          button.textContent = "Light Mode";
        } else {
          button.textContent = "Dark Mode";
        }
      }

      // Sidebar Navigation
      const homeBtn = document.getElementById("home-logo");
      const searchBtn = document.getElementById("searchbar");

      homeBtn.addEventListener("click", () => {
        loadPage("home.html").then(() => {
          bindPlaylistCards(); // ✅ ensures playlist clicks work again
        });
        setActive(homeBtn);
      });

      searchBtn.addEventListener("click", () => {
        loadPage("search.html");
        setActive(searchBtn);
      });

      function setActive(activeBtn) {
        document
          .querySelectorAll("aside .header p")
          .forEach((btn) => btn.classList.remove("active"));
        activeBtn.classList.add("active");
      }
    </script>


    <script src="script.js"></script>
  </body>
</html>
