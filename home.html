          <div data-folder="WorkOut%20Hits" class="card">
            <img src="images/5.webp" alt="WorkOut Hits" />

          <div data-folder="Podcasts" class="card">

    </div>

    <script>
      // Theme toggle
      const themeToggle = document.getElementById("theme-toggle");
      if (themeToggle) {
        themeToggle.addEventListener("click", function () {
          document.body.classList.toggle("bright-mode");
          localStorage.setItem(
            "theme",
            document.body.classList.contains("bright-mode") ? "bright" : "dark",
          );
          this.textContent = document.body.classList.contains("bright-mode")
            ? "Light Mode"
            : "Dark Mode";
        });
      }

      // Hamburger menu
      const hamburgerBtn = document.getElementById("hamburgerBtn");
      const navLinks = document.getElementById("navLinks");
      if (hamburgerBtn && navLinks) {
        hamburgerBtn.addEventListener("click", () => {
          navLinks.classList.toggle("show");
        });

        // Close menu when clicking outside
        document.addEventListener("click", (e) => {
          if (
            !hamburgerBtn.contains(e.target) &&
            !navLinks.contains(e.target)
          ) {
            navLinks.classList.remove("show");
          }
        });
      }
    </script>
  </body>
</html>
